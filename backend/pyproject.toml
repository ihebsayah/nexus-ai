[project]
name = "nexus-ai-backend"
version = "0.1.0"
description = "NEXUS AI backend scaffold"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.2",
    "psycopg[binary]==3.3.8",
    "sqlalchemy==2.0.57",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "postgres: requires explicitly approved disposable PostgreSQL mutation tests",
    "security_runtime: requires separately approved deployed M1.4 roles and runtime test mutations",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "migrations"]
