name: nexus-ai

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    platform: linux/arm64/v8
    pull_policy: never
    restart: "no"
    environment:
      # Bootstrap administrator only; application roles belong to M1.4.
      POSTGRES_USER: postgres
      POSTGRES_DB: ${NEXUS_DB_NAME:?Set NEXUS_DB_NAME in infra/.env}
      POSTGRES_PASSWORD: ${NEXUS_DB_ADMIN_PASSWORD:?Set NEXUS_DB_ADMIN_PASSWORD in infra/.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U postgres -d "$${POSTGRES_DB}" -t 3']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    shm_size: 128m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: nexus-ai-postgres-data
